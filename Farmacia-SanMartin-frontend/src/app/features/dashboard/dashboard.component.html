<div class="container-fluid py-4">
  
  <!-- Saludo al usuario -->
  <div class="mb-5">
    <h2 class="fw-bold text-dark">¡Bienvenido, {{ nombreUsuario }}!</h2>
    <p class="text-muted fs-5">Selecciona un módulo para comenzar a trabajar.</p>
  </div>

  <!-- Cuadrícula de Opciones (3 columnas) -->
  <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4 ">
    
    <!-- Iteramos sobre los módulos y filtramos por rol -->
    <div class="col" *ngFor="let modulo of modulos">
      
      <ng-container *ngIf="tieneAcceso(modulo.roles)">
        
        <!-- Tarjeta clickeable -->
        <a [routerLink]="modulo.ruta" class="text-decoration-none">
          <div class="card h-100 shadow-sm border-0 card-modulo">
            <div class="card-body text-center p-4 d-flex flex-column align-items-center justify-content-center">
              
              <!-- Icono Grande -->
              <div class="icon-wrapper mb-4">
                <i class="bi {{ modulo.icono }}"></i>
              </div>
              
              <!-- Textos -->
              <h5 class="card-title fw-bold text-dark mb-2">{{ modulo.titulo }}</h5>
              <p class="card-text text-muted small mb-0">{{ modulo.descripcion }}</p>
              
            </div>
          </div>
        </a>

      </ng-container>

    </div>
  </div>

</div>
