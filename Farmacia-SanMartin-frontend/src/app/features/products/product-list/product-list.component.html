<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold text-dark m-0"><i class="bi bi-capsule me-2"></i>Catálogo de Productos</h2>
    <!-- Botón que luego enlazará al formulario -->
    <button class="btn btn-sanmartin" routerLink="/productos/nuevo">
      <i class="bi bi-plus-circle me-1"></i> Nuevo Producto
    </button>
  </div>

  <div class="card shadow-sm border-0 mb-4">
    <div class="card-body">
      <input type="text" class="form-control" placeholder="Buscar producto por nombre o código..." [(ngModel)]="busqueda">
    </div>
  </div>

  <div class="card shadow-sm border-0 rounded-3">
    <div class="card-body p-0">
      <table class="table table-hover align-middle mb-0">
  <thead class="table-light text-muted">
    <tr>
      <th class="ps-4">Producto</th>
      <th>Categoría</th>
      <th class="text-end">Precio Venta</th>
      <th class="text-center">Stock</th>
      <th class="text-center">Estado</th>
      <th class="text-center">Acciones</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let p of productosFiltrados">
      <td class="ps-4 fw-bold text-dark">{{ p.nombreProducto }}</td>
      <td>{{ p.nombreCategoria || 'Sin categoría' }}</td>
      <td class="text-end">S/ {{ p.precioVenta | number:'1.2-2' }}</td>
      
      <td class="text-center">
        <span class="badge rounded-pill" [ngClass]="(p.stockActual || 0) === 0 ? 'bg-danger' : 'bg-success'">
          {{ p.stockActual || 0 }}
        </span>
      </td>
      
      <td class="text-center">
        <!-- Aquí arreglamos el texto del estado -->
        <span class="badge" [ngClass]="p.estadoGeneral === 'ACTIVO' ? 'bg-primary' : 'bg-secondary'">
          {{ p.estadoGeneral || 'INACTIVO' }}
        </span>
      </td>
      
      <td class="text-center">
        <button class="btn btn-sm btn-outline-info me-1" title="Ver Lotes">
          <i class="bi bi-box-seam"></i> Lotes
        </button>
        <button class="btn btn-sm btn-outline-primary" [routerLink]="['/productos/editar', p.idProducto]" title="Editar">
          <i class="bi bi-pencil"></i>
        </button>
      </td>
    </tr>
  </tbody>
</table>
    </div>
  </div>
</div>
