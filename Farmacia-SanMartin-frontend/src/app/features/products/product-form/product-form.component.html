<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow border-0 rounded-3">
                <div class="card-header bg-sanmartin-primary text-white py-3">
                    <h5 class="m-0"><i class="bi bi-plus-circle me-2"></i>Registrar Nuevo Producto</h5>
                </div>
                <div class="card-body p-4">
                    <form [formGroup]="form" (ngSubmit)="guardar()">

                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Código</label>
                                <input type="text" class="form-control" formControlName="codigo"
                                    placeholder="Ej: PARA-500">
                            </div>
                            <div class="col-md-8">
                                <label class="form-label fw-bold">Nombre del Medicamento</label>
                                <input type="text" class="form-control" formControlName="nombre"
                                    placeholder="Ej: Paracetamol 500mg">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Categoría</label>
                                <div class="input-group">
                                    <select class="form-select" formControlName="idCategoria">
                                        <option value="" disabled>Seleccione...</option>
                                        <option *ngFor="let cat of categorias" [value]="cat.idCategoria">{{
                                            cat.nombreCategoria }}</option>
                                    </select>
                                    <!-- Botón que abre el modal -->
                                    <button class="btn btn-outline-success" type="button" data-bs-toggle="modal"
                                        data-bs-target="#modalCategoria">
                                        <i class="bi bi-plus-lg"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold">Laboratorio</label>
                                <div class="input-group">
                                    <select class="form-select" formControlName="idLaboratorio">
                                        <option value="" disabled>Seleccione...</option>
                                        <option *ngFor="let lab of laboratorios" [value]="lab.idLaboratorio">{{
                                            lab.nombreLaboratorio }}</option>
                                    </select>
                                    <!-- Botón que abre el modal -->
                                    <button class="btn btn-outline-success" type="button" data-bs-toggle="modal"
                                        data-bs-target="#modalLaboratorio">
                                        <i class="bi bi-plus-lg"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Precio de Venta (S/)</label>
                                <input type="number" step="0.10" class="form-control" formControlName="precioVenta">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Stock Mínimo (Alerta)</label>
                                <input type="number" class="form-control" formControlName="stockMinimo">
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <button type="button" class="btn btn-light border" routerLink="/productos">Cancelar</button>
                            <button type="submit" class="btn btn-sanmartin" [disabled]="form.invalid">Guardar
                                Producto</button>
                        </div>
                    </form>

                    <!-- MODAL CATEGORÍA -->
                    <div class="modal fade" id="modalCategoria" tabindex="-1" aria-hidden="true">
                        <div class="modal-dialog modal-dialog-centered">
                            <div class="modal-content border-0 shadow">
                                <div class="modal-header bg-sanmartin-primary text-white">
                                    <h5 class="modal-title"><i class="bi bi-tags me-2"></i>Nueva Categoría</h5>
                                    <button type="button" class="btn-close btn-close-white"
                                        data-bs-dismiss="modal"></button>
                                </div>
                                <div class="modal-body p-4">
                                    <div class="mb-3">
                                        <label class="form-label fw-bold">Nombre</label>
                                        <input type="text" class="form-control"
                                            [(ngModel)]="nuevaCategoria.nombreCategoria" placeholder="Ej: Analgésicos">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-bold">Descripción</label>
                                        <input type="text" class="form-control"
                                            [(ngModel)]="nuevaCategoria.descripCategoria"
                                            placeholder="Ej: Medicamentos para el dolor">
                                    </div>
                                </div>
                                <div class="modal-footer bg-light">
                                    <!-- Este botón oculto sirve para que TypeScript pueda cerrarlo -->
                                    <button type="button" id="btnCerrarModalCat" class="d-none"
                                        data-bs-dismiss="modal"></button>
                                    <button type="button" class="btn btn-secondary"
                                        data-bs-dismiss="modal">Cancelar</button>
                                    <button type="button" class="btn btn-sanmartin" (click)="guardarCategoria()">Guardar
                                        Categoría</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- MODAL LABORATORIO -->
                    <div class="modal fade" id="modalLaboratorio" tabindex="-1" aria-hidden="true">
                        <div class="modal-dialog modal-dialog-centered">
                            <div class="modal-content border-0 shadow">
                                <div class="modal-header bg-sanmartin-primary text-white">
                                    <h5 class="modal-title"><i class="bi bi-buildings me-2"></i>Nuevo Laboratorio</h5>
                                    <button type="button" class="btn-close btn-close-white"
                                        data-bs-dismiss="modal"></button>
                                </div>
                                <div class="modal-body p-4">
                                    <div class="mb-3">
                                        <label class="form-label fw-bold">Nombre del Laboratorio</label>
                                        <input type="text" class="form-control"
                                            [(ngModel)]="nuevoLaboratorio.nombreLaboratorio" placeholder="Ej: Genfar">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-bold">País de Origen</label>
                                        <input type="text" class="form-control"
                                            [(ngModel)]="nuevoLaboratorio.paisOrigenLab" placeholder="Ej: Colombia">
                                    </div>
                                </div>
                                <div class="modal-footer bg-light">
                                    <!-- Este botón oculto sirve para que TypeScript pueda cerrarlo -->
                                    <button type="button" id="btnCerrarModalLab" class="d-none"
                                        data-bs-dismiss="modal"></button>
                                    <button type="button" class="btn btn-secondary"
                                        data-bs-dismiss="modal">Cancelar</button>
                                    <button type="button" class="btn btn-sanmartin"
                                        (click)="guardarLaboratorio()">Guardar Laboratorio</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
